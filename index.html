<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOAT HUNTER Vol.501</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07131d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit}.top{width:100%;aspect-ratio:3/2;background:#000 url("images/top_normal.webp?v=501") center/100% 100% no-repeat;position:relative}
.topVol{position:absolute;right:7px;top:7px;font-size:9px;opacity:.48;background:#0006;padding:2px 5px;border-radius:5px}
.wrap{max-width:900px;margin:auto;padding:10px 14px 24px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{margin:4px 0 8px;font-size:20px}
.racePanel{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:linear-gradient(145deg,#142330,#061018);border:1px solid #78bee529;border-radius:20px}
.selectCard{padding:10px 12px;border-radius:15px;background:linear-gradient(160deg,#182c3b,#07121b);border:1px solid #66bcf23d}
.eyebrow{font-size:9px;letter-spacing:.16em;color:#6f96ad;font-weight:900}.label{font-size:11px;color:#a9bbc7;margin:3px 0}
select{width:100%;height:42px;background:transparent;color:#fff;border:0;font-size:18px;font-weight:950;outline:0}
.raceStep{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:5px}.raceStep button{height:34px;border-radius:10px;border:1px solid #66bcf252;background:#102c3e;color:#fff;font-size:21px;font-weight:900}
#get{grid-column:1/-1;height:43px;border:0;border-radius:13px;background:linear-gradient(135deg,#e87418,#ff9d2d);color:#fff;font-weight:1000;font-size:17px}
#status{grid-column:1/-1;font-size:11px;color:#8ba5b6;text-align:center;min-height:14px}
.cards{display:grid;gap:9px;margin-top:10px}.card{--c:#fff;--t:#111;background:var(--c);color:var(--t);border-radius:16px;padding:10px 12px;box-shadow:0 8px 20px #0005}
.b1{--c:#fff;--t:#111}.b2{--c:#111;--t:#fff}.b3{--c:#d91f2c;--t:#fff}.b4{--c:#176fd1;--t:#fff}.b5{--c:#f0db19;--t:#111}.b6{--c:#159447;--t:#fff}
.topline{display:flex;align-items:center;gap:10px}.no{width:44px;height:44px;display:grid;place-items:center;border-radius:11px;background:#07131d;color:#fff;font-size:25px;font-weight:1000;border:2px solid currentColor}
.b1 .no,.b5 .no{color:#111;background:#fff}.b5 .no{background:#f0db19}.name{font-size:22px;font-weight:1000;flex:1}.rank{font-size:12px;font-weight:900;border:2px solid #111;border-radius:999px;padding:4px 8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.stat{background:#07131def;color:#fff;border-radius:9px;padding:6px 3px;text-align:center;border:1px solid #ffffff18}.k{font-size:9px;color:#9ab0bf}.v{font-size:14px;font-weight:1000;margin-top:2px}
@media(max-width:520px){.wrap{padding:8px 10px 20px}.racePanel{gap:7px;padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.name{font-size:20px}}
</style>

<style>
/* Vol.501: V459系の出走表レイアウト */
.cards{gap:14px}
.card{position:relative;overflow:hidden;padding:11px 14px;border-radius:20px;border:1px solid #ffffff38;box-shadow:0 8px 20px #0005}
.card:not(.open) .stats{display:none}
.topline{min-height:54px;cursor:pointer;user-select:none;-webkit-user-select:none}
.topline:after{content:"＋";margin-left:auto;width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:50%;background:#051018b8;border:1.5px solid #ffffffaa;color:#fff;font-size:22px}
.card.open .topline:after{content:"−"}
.card.b1{background:linear-gradient(135deg,#fff,#d9dfe4);color:#111}
.card.b2{background:linear-gradient(135deg,#090a0c,#292e34);color:#fff}
.card.b3{background:linear-gradient(135deg,#b8101d,#d61d29,#6b0b13);color:#fff}
.card.b4{background:linear-gradient(135deg,#0b4e9e,#166dce,#082e60);color:#fff}
.card.b5{background:linear-gradient(135deg,#fff07d,#e9ca16,#a78100);color:#111}
.card.b6{background:linear-gradient(135deg,#087334,#159c49,#063e21);color:#fff}
.card .stats{grid-template-columns:repeat(4,1fr);border-top:1px solid #ffffff2b;padding-top:9px}
.card .stat{min-height:61px;display:flex;flex-direction:column;justify-content:center}
.card .k{font-size:10px}.card .v{font-size:17px}
@media(max-width:520px){.card .stats{grid-template-columns:repeat(3,1fr)}}
</style>

</head>
<body>
<header class="top"><span class="topVol">Vol.501</span></header>
<main class="wrap">
 <div class="head"><h2>BOAT HUNTER</h2></div>
 <section class="racePanel">
  <div class="selectCard">
   <div class="eyebrow">VENUE</div><div class="label">開催場</div>
   <select id="stadium"><option value="">開催場を取得中…</option></select>
  </div>
  <div class="selectCard">
   <div class="eyebrow">RACE</div><div class="label">レース</div>
   <select id="race"></select>
   <div class="raceStep"><button id="prev" type="button">←</button><button id="next" type="button">→</button></div>
  </div>
  <button id="get" type="button">出走表取得</button>
  <div id="status"></div>
 </section>
 <section id="cards" class="cards"></section>
</main>
<script>
const API="https://boatraceopenapi.github.io/api/v1/";
const VENUES={1:"桐生",2:"戸田",3:"江戸川",4:"平和島",5:"多摩川",6:"浜名湖",7:"蒲郡",8:"常滑",9:"津",10:"三国",11:"びわこ",12:"住之江",13:"尼崎",14:"鳴門",15:"丸亀",16:"児島",17:"宮島",18:"徳山",19:"下関",20:"若松",21:"芦屋",22:"福岡",23:"唐津",24:"大村"};
const $=id=>document.getElementById(id), stadium=$("stadium"), race=$("race"), cards=$("cards"), statusEl=$("status");
let dayData=null;
for(let i=1;i<=12;i++) race.add(new Option(i+"R",i));
function jstKey(){const d=new Date(Date.now()+9*3600000);return d.toISOString().slice(0,10).replaceAll("-","")}
async function loadDay(){
 statusEl.textContent="当日開催場を取得中…";
 const key=jstKey(), year=key.slice(0,4);
 const urls=[API+"today.json",API+year+"/"+key+".json"];
 let err;
 for(const u of urls){try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error(r.status);const j=await r.json();if(j?.programs?.stadiums){dayData=j;break}}catch(e){err=e}}
 if(!dayData){stadium.innerHTML='<option value="">取得失敗</option>';statusEl.textContent="開催場を取得できません";return}
 const ss=dayData.programs.stadiums||{}; stadium.innerHTML="";
 Object.keys(ss).sort((a,b)=>+a-+b).forEach(k=>stadium.add(new Option(VENUES[+k]||("場"+k),k)));
 statusEl.textContent=stadium.options.length?`${stadium.options.length}場 開催`:"本日の開催場なし";
}
function step(n){let v=+race.value+n;if(v<1)v=12;if(v>12)v=1;race.value=v}
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
$("get").onclick=renderProgram;
function val(v,suffix=""){return v===null||v===undefined||v===""?"—":v+suffix}
function rankName(n){return ({1:"A1",2:"A2",3:"B1",4:"B2"})[n]||"—"}
function renderProgram(){
 cards.innerHTML="";
 const s=stadium.value,r=String(race.value),raceObj=dayData?.programs?.stadiums?.[s]?.races?.[r];
 const racers=raceObj?.racers;
 if(!racers){statusEl.textContent=`${VENUES[+s]||""} ${r}R：出走表なし`;return}
 const list=Object.values(racers).sort((a,b)=>a.entry_number-b.entry_number);
 if(list.length!==6){statusEl.textContent=`${VENUES[+s]||""} ${r}R：${list.length}艇のみ`;return}
 list.forEach(x=>{
  const n=x.entry_number;
  const el=document.createElement("article");el.className=`card b${n}`;
  el.innerHTML=`<div class="topline"><div class="no">${n}</div><div class="name">${x.name||"—"}</div><span class="rank">${rankName(x.rank_number)}</span></div>
  <div class="stats">
   <div class="stat"><div class="k">登録番号</div><div class="v">${val(x.number)}</div></div>
   <div class="stat"><div class="k">全国勝率</div><div class="v">${val(x.national_win_rate)}</div></div>
   <div class="stat"><div class="k">当地勝率</div><div class="v">${val(x.local_win_rate)}</div></div>
   <div class="stat"><div class="k">平均ST</div><div class="v">${val(x.average_start_timing)}</div></div>
   <div class="stat"><div class="k">全国2連対</div><div class="v">${val(x.national_top_2_percent,"%")}</div></div>
   <div class="stat"><div class="k">全国3連対</div><div class="v">${val(x.national_top_3_percent,"%")}</div></div>
   <div class="stat"><div class="k">モーター2連対</div><div class="v">${val(x.motor_top_2_percent,"%")}</div></div>
   <div class="stat"><div class="k">F</div><div class="v">${val(x.flying_count)}</div></div>
  </div>`;
  el.querySelector(".topline").onclick=()=>el.classList.toggle("open");
  cards.appendChild(el);
 });
 statusEl.textContent=`${VENUES[+s]} ${r}R：6艇取得完了`;
}
loadDay();
</script>
</body>
</html>
