<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>BOAT HUNTER V468</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:980px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.logo{font-size:22px;font-weight:900;letter-spacing:.5px}.vol{font-size:11px;opacity:.55}.panel{background:#101d2d;border:1px solid #26384d;border-radius:12px;padding:10px;margin-bottom:9px}.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pick label{font-size:11px;color:#9fb1c5;font-weight:700}.pick select{width:100%;margin-top:4px;height:42px;border:1px solid #3b526c;border-radius:9px;background:#091522;color:#fff;font-size:17px;font-weight:800;padding:0 8px}.step{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}.step button,.get{border:0;border-radius:9px;font-weight:900;color:#fff}.step button{height:30px;background:#263b53}.get{width:100%;height:42px;margin-top:9px;background:#ef7d18;font-size:16px}.status{font-size:12px;color:#aebed0;margin-top:7px;min-height:16px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.card{border-radius:10px;overflow:hidden;min-width:0;border:1px solid rgba(255,255,255,.18);cursor:pointer}.head{padding:7px 5px;font-weight:900;display:flex;align-items:center;gap:5px}.boat{font-size:18px}.name{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.body{padding:7px 5px;font-size:11px;line-height:1.55}.body b{font-size:14px}.c1{background:#f4f4f4;color:#111}.c2{background:#151515;color:#fff}.c3{background:#d92929;color:#fff}.c4{background:#1764bd;color:#fff}.c5{background:#f2cf25;color:#111}.c6{background:#17844b;color:#fff}.history{display:none;margin-top:8px;background:#0a1523;border-radius:9px;padding:8px;grid-column:1/-1}.history.on{display:block}.hTitle{font-weight:900;margin-bottom:6px}.runs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.run{background:#132338;border-radius:7px;padding:5px;font-size:10px;line-height:1.4}.p1{border-left:4px solid #f23c3c}.p2{border-left:4px solid #f0d331}.p3{border-left:4px solid #3b8cff}@media(max-width:720px){.app{padding:6px}.cards{grid-template-columns:repeat(3,1fr)}.runs{grid-template-columns:repeat(2,1fr)}.logo{font-size:19px}}@media(max-width:380px){.cards{gap:3px}.body{font-size:10px}.name{font-size:11px}}
</style></head><body><main class="app"><div class="top"><div class="logo">BOAT HUNTER</div><div class="vol">Vol.468</div></div><section class="panel"><div class="pick"><label>開催場<select id="stadium"><option>取得中...</option></select></label><label>レース<select id="race"></select><div class="step"><button id="prev">←</button><button id="next">→</button></div></label></div><button class="get" id="get">出走表取得</button><div class="status" id="status"></div></section><section id="cards" class="cards"></section><section id="history" class="history"></section></main><script>
const N=['','桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'],S=document.querySelector('#stadium'),R=document.querySelector('#race'),C=document.querySelector('#cards'),H=document.querySelector('#history'),T=document.querySelector('#status');let DATA=null,DAY='';
for(let i=1;i<=12;i++)R.add(new Option(i+'R',i));const jst=()=>new Date(Date.now()+324e5).toISOString().slice(0,10).replaceAll('-','');const url=d=>`https://boatraceopenapi.github.io/api/v1/${d.slice(0,4)}/${d}.json`;
async function loadDay(){DAY=jst();T.textContent='開催場を取得中…';try{let r=await fetch(url(DAY),{cache:'no-store'});if(!r.ok)throw Error(r.status);DATA=await r.json();let ss=DATA?.programs?.stadiums||{};S.innerHTML='';Object.keys(ss).sort((a,b)=>a-b).forEach(k=>{if(Object.keys(ss[k]?.races||{}).length)S.add(new Option(N[+k]||k,k))});T.textContent=S.options.length?`${S.options.length}場 開催`:'本日の開催場がありません';}catch(e){S.innerHTML='<option>取得失敗</option>';T.textContent='出走表API取得失敗：'+e.message}}
function grade(n){return ['','B2','B1','A2','A1'][+n]||'-'}function raceObj(){return DATA?.programs?.stadiums?.[S.value]?.races?.[R.value]}
function draw(){let x=raceObj(),rs=x?.racers;if(!rs||Object.keys(rs).length!==6){C.innerHTML='';T.textContent='6艇の出走表を取得できません';return}C.innerHTML='';H.className='history';Object.keys(rs).sort((a,b)=>a-b).forEach(k=>{let p=rs[k],d=document.createElement('article');d.className='card c'+k;d.innerHTML=`<div class="head"><span class="boat">${k}</span><span class="name">${p.name||'-'}</span></div><div class="body">${grade(p.rank_number)}　#${p.number||'-'}<br>全国 <b>${p.national_win_rate??'-'}</b><br>当地 ${p.local_win_rate??'-'}<br>ST ${p.average_start_timing??'-'}<br>M${p.motor_number??'-'} ${p.motor_top_2_percent??'-'}%</div>`;d.onclick=()=>past20(p);C.appendChild(d)});T.textContent=`${N[+S.value]} ${R.value}R　6艇取得完了`}
const TECH=['','逃げ','差し','まくり','まくり差し','抜き','恵まれ'];
function dayKey(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
async function past20(p){H.className='history on';H.innerHTML=`<div class="hTitle">${p.name}　過去20走</div><div>取得中…</div>`;let key='bh20v468_'+p.number,hit=localStorage.getItem(key);if(hit){try{let c=JSON.parse(hit);if(Date.now()-c.t<864e5){render20(p,c.v);return}}catch(e){}}let out=[],base=new Date(+DAY.slice(0,4),+DAY.slice(4,6)-1,+DAY.slice(6,8));for(let off=1;off<=120&&out.length<20;off+=6){let jobs=[];for(let j=0;j<6;j++){let d=new Date(base);d.setDate(base.getDate()-(off+j));let q=dayKey(d);jobs.push(fetch(url(q),{cache:'force-cache'}).then(r=>r.ok?r.json():null).catch(()=>null))}let days=await Promise.all(jobs);for(let z of days){let ss=z?.programs?.stadiums||{};for(let st of Object.values(ss))for(let rc of Object.values(st.races||{})){let rr=rc.result?.racers||{},mine=Object.values(rr).find(a=>+a.number===+p.number);if(mine){let win=Object.values(rr).find(a=>+a.place_number===1);out.push({date:rc.date,stadium:+rc.stadium_number,race:+rc.race_number,course:mine.course_number,st:mine.start_timing,place:mine.place_number,tech:+rc.result?.technique_number||0,winner:win?.entry_number||'-'})}}}out.sort((a,b)=>b.date.localeCompare(a.date)||b.race-a.race);out=out.slice(0,20);try{localStorage.setItem(key,JSON.stringify({t:Date.now(),v:out}))}catch(e){}render20(p,out)}
function render20(p,out){H.innerHTML=`<div class="hTitle">${p.name}　過去${out.length}走</div><div class="runs">${out.map(a=>`<div class="run p${a.place}">${a.date?.slice(5)} ${N[a.stadium]}${a.race}R<br>${a.course||'-'}C　ST ${a.st??'-'}　<b>${a.place||'-'}着</b><br>${TECH[a.tech]||'-'}　1着:${a.winner}号艇</div>`).join('')||'<div>履歴なし</div>'}</div>`}
document.querySelector('#get').onclick=draw;document.querySelector('#prev').onclick=()=>{R.value=R.value==1?12:+R.value-1};document.querySelector('#next').onclick=()=>{R.value=R.value==12?1:+R.value+1};loadDay();
</script></body></html>
